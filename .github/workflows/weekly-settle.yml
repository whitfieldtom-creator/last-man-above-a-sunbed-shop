name: Weekly settle and pull

on:
  schedule:
    # 06:00 UTC every Tuesday — targets 6am UK time. Not time-critical (unlike
    # the Friday report), so a plain fixed UTC time is fine: this lands at
    # exactly 6am during GMT and 7am during BST, no DST handling needed.
    - cron: "0 6 * * 2"
    # Same-day fallback, not a DST accommodation — GitHub Actions schedules
    # are best-effort and can be dropped outright, not just delayed (this
    # actually happened: the 06:00 trigger silently never fired one week,
    # confirmed via the Actions API showing zero runs, no platform incident,
    # workflow state "active"). runWeeklySettleAndPull is already idempotent
    # and safe to call more than once, so if 06:00 lands, this is a no-op;
    # if 06:00 gets dropped, this catches it the same day instead of the
    # week silently going unsettled until someone notices.
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

jobs:
  settle-and-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Call settle-and-pull endpoint
        run: |
          curl --fail-with-body -X POST "${APP_URL}/api/cron/settle-and-pull" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
